<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>陈守义 · 一生</title>
<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.180.0",
  "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/"
}}
</script>
<style>
  :root{
    --paper:#f4efe4; --paper2:#ece3d2; --ink:#2f2a22; --muted:#7d6f5a;
    --red:#9c3a2f; --line:#d9cdb6; --gold:#b08b4f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  body{overflow:hidden}
  #app{height:100%;position:relative}

  /* paper texture */
  #app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(circle at 20% 30%,rgba(176,139,79,.05) 0,transparent 40%),
                     radial-gradient(circle at 80% 70%,rgba(156,58,47,.04) 0,transparent 45%);}

  .page{position:absolute;inset:0;display:none;flex-direction:column;
    padding:clamp(24px,4vw,64px) clamp(24px,7vw,110px);overflow:auto}
  .page.active{display:flex}

  /* cover */
  .cover{align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(ellipse at 50% 40%,#faf5ea 0,#ece0cb 100%)}
  .cover .seal{width:64px;height:64px;border:2px solid var(--red);color:var(--red);
    display:flex;align-items:center;justify-content:center;border-radius:6px;
    font-size:26px;font-family:serif;margin:0 auto 28px;letter-spacing:-2px;line-height:1.05}
  .cover h1{font-family:serif;font-size:clamp(44px,8vw,86px);margin:0;letter-spacing:.12em;color:var(--ink)}
  .cover .sub{font-family:serif;font-size:clamp(15px,2.2vw,22px);color:var(--muted);margin-top:18px;letter-spacing:.2em}
  .cover .line{width:120px;height:1px;background:var(--gold);margin:32px auto}
  .cover .intro{max-width:620px;line-height:2;color:#5b5140;font-size:15px;margin:0 auto 36px}
  .cover .life{font-family:serif;color:var(--red);letter-spacing:.25em;font-size:14px;margin-bottom:40px}
  .btn{cursor:pointer;border:1px solid var(--red);color:var(--red);background:transparent;
    padding:12px 34px;font-size:15px;letter-spacing:.15em;transition:.2s;border-radius:2px}
  .btn:hover{background:var(--red);color:#fff}
  .btn.solid{background:var(--red);color:#fff}
  .btn.solid:hover{background:#7d2c23}

  /* toc */
  .toc-head,.chapter-head{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px;flex-shrink:0}
  .toc-head h2,.chapter-head h2{font-family:serif;font-size:26px;margin:0;letter-spacing:.1em}
  .toc-head .en,.chapter-head .en{font-family:serif;color:var(--muted);font-size:13px;letter-spacing:.2em}
  .toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .toc-item{text-align:left;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.35);
    padding:18px 20px;transition:.2s;position:relative;border-radius:2px}
  .toc-item:hover{border-color:var(--red);transform:translateY(-2px);background:rgba(255,255,255,.7)}
  .toc-item .yr{font-family:serif;color:var(--red);font-size:13px;letter-spacing:.15em}
  .toc-item .tt{font-family:serif;font-size:20px;margin:6px 0;color:var(--ink)}
  .toc-item .st{font-size:12px;color:var(--muted)}
  .toc-item .num{position:absolute;right:16px;top:14px;font-family:serif;font-size:30px;color:var(--line)}

  /* chapter spread */
  .spread{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,60px);
    flex:1;min-height:0;align-items:stretch}
  .stage{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,#f7f2e6,#e7dcc7);
    border-radius:2px;overflow:hidden;min-height:320px}
  #viewer{width:100%;height:100%;position:absolute;inset:0}
  .stage .hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);
    background:rgba(244,239,228,.8);padding:5px 10px;border-radius:2px;letter-spacing:.05em}
  .stage .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;letter-spacing:.1em;text-align:center;padding:20px}
  .stage .photoback{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;
    background-position:center;filter:sepia(.15);opacity:0;transition:opacity .5s}

  .chapter-text{display:flex;flex-direction:column;min-height:0;overflow:auto;padding-right:8px}
  .chapter-text .yr{font-family:serif;color:var(--red);font-size:15px;letter-spacing:.2em;margin-bottom:8px}
  .chapter-text h3{font-family:serif;font-size:clamp(26px,4vw,40px);margin:0 0 6px;line-height:1.3}
  .chapter-text .subtitle{font-family:serif;color:var(--gold);font-size:15px;letter-spacing:.08em;margin-bottom:20px}
  .chapter-text .story{font-size:15px;line-height:2.1;color:#453b2d;text-align:justify}
  .chapter-text .era{margin-top:20px;padding:14px 16px;border-left:3px solid var(--gold);
    background:rgba(176,139,79,.08);font-size:12.5px;line-height:1.8;color:#6a5c46}
  .chapter-text .era b{color:var(--gold);letter-spacing:.1em}
  .chapter-text .lesson{margin-top:18px;font-family:serif;font-size:16px;color:var(--red);
    line-height:1.8;padding-top:16px;border-top:1px dashed var(--line)}
  .artifact{margin-top:auto;padding-top:20px}
  .artifact .cap{font-size:12px;color:var(--muted);line-height:1.7}
  .artifact .cap b{color:var(--ink);font-family:serif}

  /* nav */
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;
    background:rgba(244,239,228,.92);border:1px solid var(--line);padding:8px 16px;border-radius:30px;z-index:20}
  .nav button{cursor:pointer;border:none;background:transparent;color:var(--ink);font-size:18px;
    width:34px;height:34px;border-radius:50%;transition:.2s}
  .nav button:hover:not(:disabled){background:var(--red);color:#fff}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav .dots{display:flex;gap:7px;align-items:center;padding:0 6px}
  .nav .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
  .nav .dot.on{background:var(--red);transform:scale(1.4)}
  .nav .lbl{font-family:serif;font-size:12px;color:var(--muted);min-width:70px;text-align:center}

  @media(max-width:820px){
    .spread{grid-template-columns:1fr;grid-template-rows:minmax(220px,42vh) 1fr;gap:18px}
    .chapter-text{padding-right:0}
    .page{padding:20px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
let data, current = 0;
const viewerCache = {};

async function loadData(){
  const r = await fetch('./memoir-data.json?t='+Date.now());
  data = await r.json();
  buildPages();
}

function pageHTML(cover){
  return '';
}

function buildPages(){
  // cover
  const cover = document.createElement('section');
  cover.className = 'page cover active';
  cover.innerHTML = `
    <div class="seal">守<br>义</div>
    <h1>${data.person.name} · 一生</h1>
    <div class="sub">一个普通中国人的六十年</div>
    <div class="line"></div>
    <p class="intro">${data.person.intro}</p>
    <div class="life">${data.person.lifeSpan}</div>
    <button class="btn solid" id="openBook">翻开这本册子</button>`;
  app.appendChild(cover);

  // toc
  const toc = document.createElement('section');
  toc.className = 'page';
  let items = data.chapters.map((c,i)=>`
    <button class="toc-item" data-go="${i+2}">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <div class="yr">${c.era}</div>
      <div class="tt">${c.year} · ${c.title}</div>
      <div class="st">${c.artifact.name}</div>
    </button>`).join('');
  toc.innerHTML = `
    <div class="toc-head"><h2>目 录</h2><span class="en">CONTENTS · ${data.chapters.length} CHAPTERS</span></div>
    <div class="toc-grid">${items}</div>`;
  app.appendChild(toc);

  // chapters
  data.chapters.forEach((c,i)=>{
    const pg = document.createElement('section');
    pg.className = 'page';
    pg.innerHTML = `
      <div class="chapter-head"><h2>${c.title}</h2><span class="en">CHAPTER ${String(i+1).padStart(2,'0')}</span></div>
      <div class="spread">
        <div class="stage" id="stage-${i}">
          <div id="viewer-${i}" style="width:100%;height:100%;position:absolute;inset:0"></div>
          <div class="loading" id="load-${i}">正在取来「${c.artifact.name}」…<br><small style="opacity:.7;margin-top:8px;display:block">首次加载模型需要一点时间</small></div>
          <div class="hint">拖动旋转 · 滚轮缩放</div>
        </div>
        <div class="chapter-text">
          <div class="yr">${c.year} · ${c.era}</div>
          <h3>${c.title}</h3>
          <div class="subtitle">${c.subtitle}</div>
          <div class="story">${c.story}</div>
          <div class="era"><b>那年头</b>　${c.eraNote}</div>
          <div class="lesson">${c.lesson}</div>
          <div class="artifact"><div class="cap"><b>那一件：</b>${c.artifact.caption}</div></div>
        </div>
      </div>`;
    app.appendChild(pg);
  });

  // nav
  const nav = document.createElement('div');
  nav.className = 'nav';
  const total = data.chapters.length + 2;
  let dots = Array.from({length:total},(_,i)=>`<span class="dot" data-dot="${i}"></span>`).join('');
  nav.innerHTML = `<button id="prev">‹</button><div class="dots">${dots}</div>
    <button id="next">›</button><span class="lbl" id="lbl"></span>`;
  document.body.appendChild(nav);

  document.getElementById('openBook').onclick = ()=>go(1);
  document.getElementById('prev').onclick = ()=>go(current-1);
  document.getElementById('next').onclick = ()=>go(current+1);
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.querySelectorAll('[data-dot]').forEach(d=>d.onclick=()=>go(+d.dataset.dot));
  addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') go(current+1);
    if(e.key==='ArrowLeft') go(current-1);
  });
  go(0);
}

function go(n){
  const total = data.chapters.length + 2;
  const pages = document.querySelectorAll('.page');
  if(n<0||n>=total) return;
  pages.forEach((p,i)=>p.classList.toggle('active',i===n));
  current = n;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===n));
  document.getElementById('prev').disabled = n===0;
  document.getElementById('next').disabled = n===total-1;
  document.getElementById('lbl').textContent = n===0?'封面':n===1?'目录':`第 ${n-1} 章 / ${data.chapters.length}`;
  if(n>=2) initViewer(n-2);
  window.scrollTo(0,0);
}

async function initViewer(idx){
  if(viewerCache[idx]) return;
  viewerCache[idx] = true;
  const host = document.getElementById('viewer-'+idx);
  const loadEl = document.getElementById('load-'+idx);
  const glb = `./assets/${data.chapters[idx].id}.glb`;
  try{
    const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
    const camera = new THREE.PerspectiveCamera(42,1,0.01,1000);
    const controls = new OrbitControls(camera,renderer.domElement);
    controls.enableDamping = true;
    const loader = new GLTFLoader();
    loader.load(glb,(gltf)=>{
      const model = gltf.scene;
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxd = Math.max(size.x,size.y,size.z)||1;
      camera.position.copy(center).add(new THREE.Vector3(maxd*0.6,maxd*0.4,maxd*1.4));
      camera.near = maxd/100; camera.far = maxd*100; camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.minDistance = maxd*0.5; controls.maxDistance = maxd*4;
      controls.update();
      loadEl.style.display='none';
    },undefined,(err)=>{
      loadEl.innerHTML='模型还没生成好<br><small style="opacity:.7">正在排队生成中，稍后再来翻这一页</small>';
    });
    scene.add(new THREE.HemisphereLight(0xffffff,0xbba478,1.6));
    const dir = new THREE.DirectionalLight(0xfff0d8,2.0); dir.position.set(4,6,5); scene.add(dir);
    function resize(){
      const w=host.clientWidth,h=host.clientHeight;
      if(!w||!h) return;
      camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
    }
    addEventListener('resize',resize); resize();
    renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
  }catch(e){
    loadEl.textContent='3D 加载失败，请检查网络。';
    console.error(e);
  }
}

loadData().catch(e=>{app.innerHTML='<p style="padding:40px">数据加载失败：'+e+'</p>';});
</script>
</body>
</html>
